services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: horilla
      POSTGRES_USER: horilla
      POSTGRES_PASSWORD: horilla123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7
    restart: always

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - db
      - redis
    expose:
      - "8000"
    networks:
      - dokploy-network
      - default
    command: >
      sh -c "sleep 5 &&
             python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn horilla.wsgi:application --bind 0.0.0.0:8000"
    restart: always

volumes:
  postgres_data:

networks:
  dokploy-network:
    external: true
